################################################################################
# PostgreSQL production configuration
################################################################################

# ------------------------------------------------------------------------
# CONNECTIONS AND AUTHENTICATION
# ------------------------------------------------------------------------

listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 3

# Connection pooling is expected to be handled by an external pooler
# (e.g. PgBouncer) in front of this instance; the settings below keep
# idle/abandoned backend connections from accumulating.
idle_in_transaction_session_timeout = 60000
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6

# ------------------------------------------------------------------------
# PGVECTOR
# ------------------------------------------------------------------------

# pgvector ships as a regular extension and does not require
# shared_preload_libraries. Enable it per-database via:
#   CREATE EXTENSION IF NOT EXISTS vector;
# maintenance_work_mem below is raised to speed up HNSW/IVFFlat index builds.

# ------------------------------------------------------------------------
# MEMORY
# ------------------------------------------------------------------------

shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB
huge_pages = try
temp_buffers = 16MB

# ------------------------------------------------------------------------
# WRITE-AHEAD LOG (WAL)
# ------------------------------------------------------------------------

wal_level = replica
synchronous_commit = on
wal_compression = on
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
archive_mode = off
max_wal_senders = 5
wal_keep_size = 512MB

# ------------------------------------------------------------------------
# QUERY PLANNING / PERFORMANCE TUNING
# ------------------------------------------------------------------------

random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100
max_parallel_workers_per_gather = 2
max_parallel_workers = 8
max_worker_processes = 8

# ------------------------------------------------------------------------
# AUTOVACUUM
# ------------------------------------------------------------------------

autovacuum = on
autovacuum_max_workers = 4
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_naptime = 30s

# ------------------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------------------

logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 250
log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_error_verbosity = default

# ------------------------------------------------------------------------
# SECURITY
# ------------------------------------------------------------------------

ssl = on
ssl_cert_file = 'server.crt'
ssl_key_file = 'server.key'
ssl_min_protocol_version = 'TLSv1.2'
password_encryption = scram-sha-256
row_security = on
