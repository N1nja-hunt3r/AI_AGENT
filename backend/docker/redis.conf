################################################################################
# Redis production configuration
################################################################################

bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

################################ GENERAL ######################################

daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16

################################ SNAPSHOTTING (RDB) ###########################

save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

################################ APPEND ONLY FILE (AOF) #######################

appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes
aof-timestamp-enabled no

################################ MEMORY MANAGEMENT #############################

maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5
maxmemory-clients 0

################################ SECURITY ######################################

# Replace with a strong, randomly generated password in production
# (override via --requirepass at container start to avoid baking secrets
# into source control).
requirepass changeme-replace-with-a-strong-redis-password

rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command SHUTDOWN SHUTDOWN_a8f3e9

################################ CLIENTS #######################################

maxclients 10000

################################ LAZY FREEING ##################################

lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

################################ SLOW LOG ######################################

slowlog-log-slower-than 10000
slowlog-max-len 128

################################ LATENCY MONITOR ###############################

latency-monitor-threshold 100
