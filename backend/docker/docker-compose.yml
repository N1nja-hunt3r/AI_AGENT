x-backend-environment: &backend-environment
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  CHROMA_PATH: ${CHROMA_PATH:-/app/data/chroma}
  SECRET_KEY: ${SECRET_KEY}
  JWT_SECRET: ${JWT_SECRET}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  MODEL_NAME: ${MODEL_NAME:-claude-sonnet-4-6}
  TEMPERATURE: ${TEMPERATURE:-0.2}
  MAX_TOKENS: ${MAX_TOKENS:-4096}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY}
  TAVILY_API_KEY: ${TAVILY_API_KEY}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    build:
      context: ../..
      dockerfile: backend/docker/Dockerfile
    image: ai-os-backend:latest
    container_name: ai-os-backend
    environment:
      <<: *backend-environment
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    networks:
      - ai_os_network
    volumes:
      - backend_data:/app/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging: *default-logging

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-os-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_os}
      POSTGRES_USER: ${POSTGRES_USER:-ai_os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    networks:
      - ai_os_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_os} -d ${POSTGRES_DB:-ai_os}"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: ai-os-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - ai_os_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    logging: *default-logging

  chroma:
    image: chromadb/chroma:latest
    container_name: ai-os-chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - ai_os_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')\" || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    container_name: ai-os-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ai_os_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    logging: *default-logging

networks:
  ai_os_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  chroma_data:
    driver: local
  backend_data:
    driver: local
  nginx_cache:
    driver: local
